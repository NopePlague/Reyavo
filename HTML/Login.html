<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/SignUp</title>
  <link rel="icon" href="./../Images/Logo.png">
  <style>
    body{
      background: linear-gradient(to left, #190A05 0%, #870000 100%);
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #container{
      width: 450px;
      height: 550px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      background: -webkit-linear-gradient(to right, #232526, #414345);
      background: linear-gradient(to left, #414345 0%, #232526 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
      .face {
    position: relative;
    width: 120px;
    height: 120px;
    background: #f5c9a7;
    border-radius: 50%;
    box-shadow: inset -10px 0 15px rgba(0,0,0,0.1);
    animation: faceRotateLook 12s ease-in-out infinite;
    transform-style: preserve-3d;
    transform-origin: center center;
  }

  /* Hair: simple top band with smooth gradient */
  .face::before {
    content: "";
    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 40px;
    background: linear-gradient(135deg, #3e1e1e 0%, #6b3d3d 100%);
    border-radius: 80% 80% 40% 40% / 100% 100% 20% 20%;
    box-shadow: 0 5px 8px rgba(62, 30, 30, 0.8);
    z-index: 10;
  }

  @keyframes faceRotateLook {
    0%, 100% { transform: rotateY(0deg) rotateX(15deg); }
    16% { transform: rotateY(20deg) rotateX(15deg); }
    33% { transform: rotateY(-20deg) rotateX(15deg); }
    50% { transform: rotateY(0deg) rotateX(15deg); }
    66% { transform: rotateY(0deg) rotateX(25deg); }
    83% { transform: rotateY(0deg) rotateX(15deg); }
  }

  .eyes {
    position: absolute;
    top: 52px;
    left: 20px;
    width: 80px;
    height: 30px;
    display: flex;
    justify-content: space-between;
  }

  .eye {
    position: relative;
    width: 30px;
    height: 30px;
    background: white;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
  }

  .eyeball {
    position: absolute;
    top: 10px;
    left: 8px;
    width: 14px;
    height: 14px;
    background: black;
    border-radius: 50%;
    animation: lookSequence 12s linear infinite, blinkSequence 12s steps(1) infinite;
    transform-origin: center;
  }

  .eye::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #f5c9a7;
    transform-origin: center bottom;
    pointer-events: none;
    animation: blinkSequence 12s steps(1) infinite;
  }

  @keyframes lookSequence {
    0%, 15%, 50%, 82%, 100% { transform: translate(0, 0); }
    16%, 32% { transform: translate(6px, 1px); }
    33%, 49% { transform: translate(-6px, 1px); }
    66%, 81% { transform: translate(0, 6px); }
  }

  @keyframes blinkSequence {
    0%, 14%, 15%, 17%, 32%, 34%, 49%, 51%, 65%, 67%, 81%, 83%, 100% { height: 14px; }
    16%, 16.5%, 33%, 33.5%, 50%, 50.5%, 66%, 66.5%, 82%, 82.5% { height: 2px; }
  }
  .log-short{
    width: 40px;
    height: 40px;
    background-color:#3e1e1e;
    border-radius: 20px;
    text-align: center;
    align-content: center;
    color: red;
    font-size: 20px;
    transition: all 0.3s;
  }
  .log-short:hover{
    box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
    cursor: pointer;
    background-color: #870000;
    color: red;
  }
  label{
    font-size: 23px;
    font-weight: bold;
    color: rgb(202, 0, 0);
    display: block;
  }
  input{
    border: none;
    height: 30px;
    font-weight: bold;
    width: 300px;
    margin-bottom: 30px;
    border-radius: 4px;
  }
  button{
    display: block;
    margin: 0 auto;
    border: none;
    background-color: #870000;
    color: white;
    width: 15vw;
    min-width: 90px;
    height: 40px;
    border-radius: 5px;
    font-weight: bolder;
    letter-spacing: 5px;
    transition: all 0.3s;
  }
  button:hover{
    box-shadow: 0px 0px 10px 2px red;
    background-color: red;
    color: #870000;
  }
  #signup-text{
    color: white;
    text-align: center;
  }
  #sign-up{
    color: red;
    text-decoration: none;
    transition: all 0.3s;
    
  }
  #sign-up:hover{
    text-shadow: 0px 0px 2px red;
    text-decoration: dashed;
  }
  @media all and 
  </style>
</head>
<body>
  <div id="container">
    <div style="margin: 40px;">
      <div class="face" role="img" aria-label="Animated circular face looking around with stylish hair and blinking eyes">
        <div class="eyes">
          <div class="eye">
            <div class="eyeball"></div>
          </div>
          <div class="eye">
            <div class="eyeball"></div>
          </div>
        </div>
      </div>
    </div>

    <div style="height: 60px; width: 100%; position: relative; top: -30px; display: flex; justify-content: space-evenly; align-items: center;">
      <div class="log-short"><a href="#" style="color: rgba(255, 0, 0, 0.806); text-decoration: none;">G</a></div>
      <div class="log-short"><a href="#" style="color: rgba(255, 0, 0, 0.806); text-decoration: none;">A</a></div>
      <div class="log-short"><a href="#" style="color: rgba(255, 0, 0, 0.806); text-decoration: none;">M</a></div>
    </div>

    <div style="width: 100%; position: relative; top: -20px; display: flex; flex-direction: column; align-items: center;">
      <form>
        <label for="username">UserName</label>
        <input type="text" id="username" name="username" required placeholder="Ex: NopePlague">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Ex: PotatoBlaster#1234" name="username" required>
        <button>LOGIN</button>
      </form>
    </div>
    <div id="signup-text">Don't have a Account. Create one: <a href="#" id="sign-up">Sign Up</a></div>

  </div>
</body>
</html>
