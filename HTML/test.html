<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Refined Animated Circular Face with Stylish Hair</title>
<style>
  body {
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    perspective: 700px;
  }
  .face {
    position: relative;
    width: 120px;
    height: 120px;
    background: #f5c9a7;
    border-radius: 50%;
    box-shadow: inset -10px 0 15px rgba(0,0,0,0.1);
    animation: faceRotateLook 12s ease-in-out infinite;
    transform-style: preserve-3d;
    transform-origin: center center;
  }

  /* Hair: simple top band with smooth gradient */
  .face::before {
    content: "";
    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 40px;
    background: linear-gradient(135deg, #3e1e1e 0%, #6b3d3d 100%);
    border-radius: 80% 80% 40% 40% / 100% 100% 20% 20%;
    box-shadow: 0 5px 8px rgba(62, 30, 30, 0.8);
    z-index: 10;
  }

  @keyframes faceRotateLook {
    0%, 100% { transform: rotateY(0deg) rotateX(15deg); }
    16% { transform: rotateY(20deg) rotateX(15deg); }
    33% { transform: rotateY(-20deg) rotateX(15deg); }
    50% { transform: rotateY(0deg) rotateX(15deg); }
    66% { transform: rotateY(0deg) rotateX(25deg); }
    83% { transform: rotateY(0deg) rotateX(15deg); }
  }

  .eyes {
    position: absolute;
    top: 52px;
    left: 20px;
    width: 80px;
    height: 30px;
    display: flex;
    justify-content: space-between;
  }

  .eye {
    position: relative;
    width: 30px;
    height: 30px;
    background: white;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
  }

  .eyeball {
    position: absolute;
    top: 10px;
    left: 8px;
    width: 14px;
    height: 14px;
    background: black;
    border-radius: 50%;
    animation: lookSequence 12s linear infinite, blinkSequence 12s steps(1) infinite;
    transform-origin: center;
  }

  .eye::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: #f5c9a7;
    transform-origin: center bottom;
    pointer-events: none;
    animation: blinkSequence 12s steps(1) infinite;
  }

  @keyframes lookSequence {
    0%, 15%, 50%, 82%, 100% { transform: translate(0, 0); }
    16%, 32% { transform: translate(6px, 1px); }
    33%, 49% { transform: translate(-6px, 1px); }
    66%, 81% { transform: translate(0, 6px); }
  }

  @keyframes blinkSequence {
    0%, 14%, 15%, 17%, 32%, 34%, 49%, 51%, 65%, 67%, 81%, 83%, 100% { height: 14px; }
    16%, 16.5%, 33%, 33.5%, 50%, 50.5%, 66%, 66.5%, 82%, 82.5% { height: 2px; }
  }
</style>
</head>
<body>

<div class="face" role="img" aria-label="Animated circular face looking around with stylish hair and blinking eyes">
  <div class="eyes">
    <div class="eye">
      <div class="eyeball"></div>
    </div>
    <div class="eye">
      <div class="eyeball"></div>
    </div>
  </div>
</div>

</body>
</html>
