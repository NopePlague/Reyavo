<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>huh</title>
<style>
#footer-container {
  width: 100%;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(15px);
  color: white;
  padding: 40px 20px 20px;
  font-family: Arial, sans-serif;
  box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.2);
  border-top: 1px solid rgba(255, 0, 0, 0.3);
}

.footer-inner {
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  max-width: 1200px;
  margin: 0 auto;
  gap: 30px;
}

.footer-section {
  flex: 1 1 250px;
  min-width: 220px;
}

.footer-section h3 {
  font-family: 'Bebas Neue', cursive;
  font-size: 28px;
  margin-bottom: 15px;
  letter-spacing: 2px;
  color: #ff3333;
  text-shadow: 0 0 8px #ff0000;
}

.footer-section p,
.footer-section ul {
  font-size: 16px;
  line-height: 1.5rem;
  color: #eee;
}

.footer-section ul {
  list-style: none;
  padding-left: 0;
}

.footer-section ul li {
  margin: 8px 0;
}

.footer-section ul li a {
  color: #eee;
  text-decoration: none;
  transition: color 0.3s ease;
  border-bottom: 1px dashed transparent;
}

.footer-section ul li a:hover {
  color: #ff4747;
  border-bottom-color: #ff4747;
}

.footer-section .social-icons {
  margin-top: 15px;
}

.social-icon {
  display: inline-block;
  width: 36px;
  height: 36px;
  line-height: 36px;
  margin-right: 10px;
  text-align: center;
  border-radius: 50%;
  background-color: rgba(255, 0, 0, 0.7);
  color: white;
  font-weight: bold;
  font-family: Arial, sans-serif;
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
  user-select: none;
}

.social-icon:hover {
  background-color: #ff1a1a;
  box-shadow: 0 0 20px #ff0000;
}

.footer-bottom {
  margin-top: 35px;
  text-align: center;
  font-size: 14px;
  color: #bbb;
  letter-spacing: 0.1em;
  font-weight: 600;
}

@media (max-width: 768px) {
  .footer-inner {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 30px;
  }

  .footer-section {
    max-width: 90%;
  }
}

</style>
</head>
<body style="background-color: black;">
  <footer id="footer-container">
  <div class="footer-inner">
    <div class="footer-section about">
      <h3>About Us</h3>
      <p>Reyavo - Luxury fashion redefined. Explore exclusive collections and premium styles.</p>
    </div>
    <div class="footer-section links">
      <h3>Quick Links</h3>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">Collections</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
    <div class="footer-section contact">
      <h3>Contact</h3>
      <p>Email: support@reyavo.com</p>
      <p>Phone: +91 98765 43210</p>
      <div class="social-icons">
        <a href="#" aria-label="Facebook" class="social-icon fb">F</a>
        <a href="#" aria-label="Instagram" class="social-icon ig">I</a>
        <a href="#" aria-label="Twitter" class="social-icon tw">T</a>
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    &copy; 2025 Reyavo. All rights reserved.
  </div>
</footer>



</body>
</html>
